# S1: a weekday-morning digest of my open pull requests across GitHub
# (docs/toil-tasks.md). Install with: gofer routine add pr-digest --from-bundled
name: pr-digest
description: Morning digest of my open pull requests across GitHub
gatherer: github.my_open_prs
with:
  # The search lists the most recently updated PRs first, so a limit below
  # the number of open PRs drops the stalest ones, the ones this routine is
  # for. The digest notes when the limit was reached. Max 1000.
  limit: 300
  stale_after_days: 14
schedule: "0 9 * * 1-5"
notify: on-action
